<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개</title>
    <!-- 레트로 감성을 위한 픽셀 폰트 로드 (둥근모꼴 & Press Start 2P) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* =========================================
           CSS 변수 및 테마 설정 (다크/라이트 모드)
           ========================================= */
        :root {
            /* 기본값: 오락실 어두운 화면 (Dark Mode) */
            --bg-color: #120d1d;
            --panel-bg: #1e1633;
            --text-color: #ffffff;
            --text-muted: #b8a9d6;
            --accent-primary: #ff2a85;   /* 네온 핑크 */
            --accent-secondary: #00f0ff; /* 네온 시안 */
            --accent-yellow: #ffe600;    /* 코인 옐로우 */
            --accent-green: #00ff66;     /* 1UP 그린 */
            --border-color: #ffffff;
            --shadow-color: #000000;
            --scanline-opacity: 0.15;
            --grid-color: rgba(255, 42, 133, 0.15);
        }

        body.light-mode {
            /* 밝은 화면 (GameBoy / Pastel Retro Mode) */
            --bg-color: #f4f1de;
            --panel-bg: #ffffff;
            --text-color: #2b2d42;
            --text-muted: #5c607a;
            --accent-primary: #e63946;
            --accent-secondary: #1d3557;
            --accent-yellow: #f4a261;
            --accent-green: #2a9d8f;
            --border-color: #2b2d42;
            --shadow-color: rgba(43, 45, 66, 0.3);
            --scanline-opacity: 0.04;
            --grid-color: rgba(29, 53, 87, 0.08);
        }

        /* =========================================
           기본 리셋 및 전체 레이아웃
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 게임 느낌을 위해 텍스트 드래그 방지 */
        }

        input {
            user-select: auto; /* 입력창은 타이핑 가능하도록 허용 */
        }

        html {
            font-size: 19px; /* 전체 기준 글자 크기 확대 */
        }

        body {
            font-family: 'DungGeunMo', 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* 레트로 그리드 배경 */
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 32px 32px;
            padding: 16px;
        }

        /* 브라운관(CRT) 스캔라인 효과 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, var(--scanline-opacity)) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9998;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 40px;
        }

        /* =========================================
           8비트 픽셀 박스 & 버튼 공통 스타일
           ========================================= */
        .pixel-box {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 24px;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 0px var(--shadow-color);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        body.light-mode .section-title {
            color: var(--accent-primary);
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .pixel-btn {
            font-family: 'DungGeunMo', 'Press Start 2P', monospace;
            font-size: 1.15rem;
            padding: 14px 22px;
            background-color: var(--accent-primary);
            color: #ffffff;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pixel-btn:hover {
            filter: brightness(1.1);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--shadow-color);
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        .pixel-btn.secondary {
            background-color: var(--accent-secondary);
            color: #120d1d;
        }

        body.light-mode .pixel-btn.secondary {
            color: #ffffff;
        }

        .pixel-btn.yellow {
            background-color: var(--accent-yellow);
            color: #120d1d;
        }

        /* =========================================
           상단 상태바 (HUD) & 테마 스위치
           ========================================= */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 18px;
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            font-size: 1.1rem;
        }

        .hud-stats {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .blink {
            animation: blinker 1s steps(2, start) infinite;
            color: var(--accent-green);
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* =========================================
           히어로 배너 (캐릭터 소개)
           ========================================= */
        .hero-section {
            text-align: center;
            padding: 32px 20px;
        }

        .pixel-avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            animation: floatAvatar 2s ease-in-out infinite;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .hero-badge {
            display: inline-block;
            background-color: var(--accent-secondary);
            color: #120d1d;
            padding: 6px 14px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            margin-bottom: 14px;
        }

        body.light-mode .hero-badge {
            color: #ffffff;
        }

        .hero-title {
            font-size: 2.6rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px var(--accent-primary);
            letter-spacing: 2px;
        }

        body.light-mode .hero-title {
            text-shadow: 2px 2px 0px var(--accent-yellow);
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* =========================================
           방문자 환영 인사 칸
           ========================================= */
        .visitor-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pixel-input {
            flex: 1;
            min-width: 200px;
            font-family: 'DungGeunMo', monospace;
            font-size: 1.15rem;
            padding: 14px 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 3px solid var(--border-color);
            outline: none;
        }

        .pixel-input:focus {
            border-color: var(--accent-yellow);
        }

        .welcome-message-box {
            margin-top: 16px;
            padding: 16px;
            background-color: rgba(0, 255, 102, 0.12);
            border: 2px dashed var(--accent-green);
            color: var(--accent-green);
            font-size: 1.2rem;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body.light-mode .welcome-message-box {
            background-color: rgba(42, 157, 143, 0.15);
            color: #1d3557;
            border-color: #2a9d8f;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* =========================================
           좋아하는 것 3가지 (플립 카드)
           ========================================= */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 680px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .flip-card {
            background-color: transparent;
            height: 270px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 4px solid var(--border-color);
            box-shadow: 5px 5px 0px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .flip-card-front {
            background-color: var(--bg-color);
        }

        .flip-card-front:hover {
            border-color: var(--accent-yellow);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--accent-secondary);
            margin-bottom: 8px;
        }

        .card-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.08);
            padding: 4px 10px;
        }

        .flip-card-back {
            background-color: var(--accent-primary);
            color: #ffffff;
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .card-back-header {
            font-size: 0.95rem;
            background-color: #000000;
            color: var(--accent-yellow);
            padding: 4px 10px;
            width: 100%;
        }

        .card-reason {
            font-size: 1.05rem;
            line-height: 1.5;
            word-break: keep-all;
        }

        .card-back-footer {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* =========================================
           OX 퀴즈 섹션
           ========================================= */
        .quiz-question {
            font-size: 1.55rem;
            text-align: center;
            padding: 22px;
            background-color: var(--bg-color);
            border: 3px solid var(--border-color);
            margin-bottom: 22px;
            color: var(--accent-yellow);
        }

        body.light-mode .quiz-question {
            color: var(--accent-secondary);
        }

        .quiz-buttons {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .ox-btn {
            width: 130px;
            height: 85px;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .ox-btn.btn-o {
            background-color: #00b4d8;
            color: #ffffff;
        }

        .ox-btn.btn-x {
            background-color: #ef233c;
            color: #ffffff;
        }

        .quiz-result {
            margin-top: 20px;
            padding: 18px;
            text-align: center;
            font-size: 1.25rem;
            border: 3px solid var(--border-color);
            display: none;
        }

        .quiz-result.correct {
            background-color: rgba(0, 255, 102, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        body.light-mode .quiz-result.correct {
            color: #1b4332;
            background-color: #d8f3dc;
        }

        .quiz-result.wrong {
            background-color: rgba(239, 35, 60, 0.2);
            border-color: #ef233c;
            color: #ff758f;
        }

        body.light-mode .quiz-result.wrong {
            color: #800f2f;
            background-color: #ffccd5;
        }

        /* 화면 흔들림 애니메이션 (오답 시) */
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-1deg); }
            40% { transform: translateX(10px) rotate(1deg); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        .shake-effect {
            animation: screenShake 0.45s ease-in-out;
        }

        /* =========================================
           랜덤 응원 한마디 뽑기 (가챠 머신)
           ========================================= */
        .cheer-box {
            text-align: center;
        }

        .cheer-display {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            border: 3px dashed var(--accent-secondary);
            font-size: 1.3rem;
            word-break: keep-all;
            position: relative;
        }

        .cheer-counter {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 14px;
        }

        /* =========================================
           마우스 따라다니는 반짝이 & 파티클 효과
           ========================================= */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 20px;
            animation: sparkleFade 0.8s forwards ease-out;
        }

        @keyframes sparkleFade {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -120%) scale(0.2) rotate(180deg);
                opacity: 0;
            }
        }

        /* 축하 폭죽 파티클 */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        /* 모바일 대응 미세 조정 */
        @media (max-width: 480px) {
            html { font-size: 17px; }
            .hero-title { font-size: 1.9rem; }
            .section-title { font-size: 1.25rem; }
            .pixel-box { padding: 18px; }
            .ox-btn { width: 110px; height: 75px; font-size: 2rem; }
        }
    </style>

.st-bar i{display:block;height:100%;width:0;background:var(--st-accent);transition:width .3s}

.st-row>*{margin-top:0;margin-bottom:0}.st-row>.st-img,.st-row>img{flex:1 1 160px;min-width:0}
.st-cols{display:grid;gap:16px}
.st-c2{grid-template-columns:repeat(2,minmax(0,1fr))}.st-c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:600px){.st-c2,.st-c3{grid-template-columns:1fr}}
.st-col{min-width:0}
.st-swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;-webkit-overflow-scrolling:touch}
.st-swipe>*{flex:0 0 min(72%,240px);box-sizing:border-box;scroll-snap-align:start}
.st-nav-i{margin-right:5px}
@media(max-width:600px){.st-nav-tab{position:fixed;top:auto;bottom:0;left:0;border-bottom:0;border-top:1px solid rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}.st-nav-tab .st-nav-in{flex-wrap:nowrap;justify-content:space-around;gap:0;padding:4px}.st-nav-tab .st-nav-a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-nav-tab .st-nav-a.is-on{background:none;color:var(--st-accent)}.st-nav-tab .st-nav-i{margin:0;font-size:22px;line-height:1.1}}
.st-g-point{--st-g:linear-gradient(135deg,rgba(255,255,255,0),rgba(255,255,255,.45)),linear-gradient(var(--st-accent),var(--st-accent));--st-gi:#fff}.st-g-sunset{--st-g:linear-gradient(135deg,#f43f5e,#f97316);--st-gi:#fff}.st-g-ocean{--st-g:linear-gradient(135deg,#2563eb,#06b6d4);--st-gi:#fff}.st-g-grape{--st-g:linear-gradient(135deg,#7c3aed,#ec4899);--st-gi:#fff}.st-g-forest{--st-g:linear-gradient(135deg,#047857,#34d399);--st-gi:#fff}.st-g-night{--st-g:linear-gradient(135deg,#0f172a,#475569);--st-gi:#fff}.st-g-peach{--st-g:linear-gradient(135deg,#ffe4e6,#fef3c7);--st-gi:#222}.st-g-mint{--st-g:linear-gradient(135deg,#d1fae5,#dbeafe);--st-gi:#222}.st-g-lav{--st-g:linear-gradient(135deg,#ede9fe,#fce7f3);--st-gi:#222}
html body [class*="st-g-"]{background-image:var(--st-g);color:var(--st-gi)}
html body .st-gtx{color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.st-hv-lift,.st-hv-grow,.st-hv-glow,.st-hv-press{transition:translate .2s,scale .2s,box-shadow .2s}
@media(hover:hover){.st-hv-lift:hover{translate:0 -6px;box-shadow:0 14px 28px rgba(0,0,0,.18)}.st-hv-grow:hover{scale:1.04}.st-hv-glow:hover{box-shadow:0 8px 24px rgba(0,0,0,.25);box-shadow:0 0 0 3px color-mix(in srgb,var(--st-accent) 35%,transparent),0 8px 24px color-mix(in srgb,var(--st-accent) 45%,transparent)}}
.st-hv-press:active{scale:.95}
html.st-js [data-st-in]{opacity:0;transition:opacity .6s ease,transform .6s ease,translate .2s,scale .2s,box-shadow .2s}
html.st-js [data-st-in="up"]{transform:translateY(26px)}html.st-js [data-st-in="zoom"]{transform:scale(.9)}html.st-js [data-st-in="left"]{transform:translateX(-30px)}
